load_module modules/ngx_http_js_module.so;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    client_max_body_size 10G;
    js_import urlencode from /etc/nginx/urlencode.js;
    js_set $encoded_next urlencode.encodedRequestUri;

    types {
        text/html html htm shtml;
        text/css css;
        text/xml xml;
        application/javascript js ts;
        application/pdf pdf;
        image/gif gif;
        image/jpeg jpg jpeg jfif;
        image/png png;
        image/svg+xml svg;
        image/tiff tiff;
        image/vnd.wap.wbmp wbmp;
        image/webp webp;
    }

    server {
        listen 80;
        server_name default_server;
        absolute_redirect off;

        location @auth_failed {
            return 401;
        }

        location = /auth_check {
            internal;
            proxy_pass http://authentik:9000/api/v3/core/users/me/;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_intercept_errors on;
            error_page 302 401 403 = @auth_failed;

            error_log /dev/stderr info;
        }

        location @redirect_to_signin {
            return 302 /sign-in?next=$encoded_next;
        }

        location /api/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /api {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /article54/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://article54:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /article54 {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://article54:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /api/v3/flows/ {
            proxy_pass http://authentik:9000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /application/o/authorize {
            # Проверяем валидность сессии перед проксированием
            auth_request /auth_check;

            # Если API вернул 401 (Unauthorized), сессия истекла или отсутствует
            error_page 401 = @redirect_to_signin;
            error_page 403 = @redirect_to_signin;

            proxy_pass http://authentik:9000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $host:$server_port;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /application/o/ {
            proxy_pass http://authentik:9000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /static/ {
            proxy_pass http://authentik:9000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /if/flow/ {
            proxy_pass http://authentik:9000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location / {
            root /frontend;
            try_files $uri /index.html;
        }
    }
}